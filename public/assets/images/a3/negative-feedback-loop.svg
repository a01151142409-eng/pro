<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, sans-serif">
  <rect width="640" height="400" fill="#f8fafc"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Negative Feedback Loop — حلقة الارتجاع السلبي</text>
  <rect x="40" y="90" width="150" height="70" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="115" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#134e4a">Stimulus</text>
  <text x="115" y="142" text-anchor="middle" font-size="13" fill="#134e4a">مُثير (تغيّر)</text>
  <rect x="250" y="90" width="150" height="70" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="325" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Receptor</text>
  <text x="325" y="142" text-anchor="middle" font-size="13" fill="#0c4a6e">مستقبل</text>
  <rect x="460" y="90" width="150" height="70" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="535" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Control center</text>
  <text x="535" y="142" text-anchor="middle" font-size="13" fill="#78350f">مركز ضبط</text>
  <rect x="250" y="260" width="150" height="70" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="325" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">Effector</text>
  <text x="325" y="312" text-anchor="middle" font-size="13" fill="#4c1d95">عضو مؤثر</text>
  <rect x="40" y="260" width="150" height="70" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="115" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Response</text>
  <text x="115" y="312" text-anchor="middle" font-size="13" fill="#14532d">استجابة تُلغي التغيّر</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <line x1="190" y1="125" x2="246" y2="125" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="400" y1="125" x2="456" y2="125" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="535" y1="160" x2="400" y2="270" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="246" y1="295" x2="194" y2="295" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M 115 256 L 115 180" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-dasharray="6 4"/>
  <text x="70" y="215" font-size="13" fill="#b91c1c" font-weight="700">− cancels change</text>
  <text x="70" y="233" font-size="12" fill="#b91c1c">يُلغي التغيّر</text>
</svg>