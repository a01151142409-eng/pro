<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="Cairo, sans-serif">
  <rect width="660" height="460" fill="#f8fafc"/>
  <text x="330" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Autonomic Outflow — التدفق الودي ونظير الودي</text>
  <rect x="230" y="55" width="200" height="50" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="330" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">CNS</text>
  <text x="330" y="98" text-anchor="middle" font-size="12" fill="#334155">الدماغ والنخاع الشوكي</text>
  <rect x="40" y="150" width="260" height="120" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="170" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">Sympathetic — ودي</text>
  <text x="170" y="202" text-anchor="middle" font-size="13" fill="#7f1d1d">Thoracolumbar: T1–T12</text>
  <text x="170" y="224" text-anchor="middle" font-size="13" fill="#7f1d1d">+ upper 2–3 lumbar</text>
  <text x="170" y="250" text-anchor="middle" font-size="12" fill="#7f1d1d">Ganglia remote — عقد بعيدة</text>
  <rect x="360" y="150" width="260" height="120" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="490" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Parasympathetic — نظير ودي</text>
  <text x="490" y="202" text-anchor="middle" font-size="13" fill="#1e3a8a">Craniosacral: III, VII, IX, X</text>
  <text x="490" y="224" text-anchor="middle" font-size="13" fill="#1e3a8a">+ S2, S3, S4</text>
  <text x="490" y="250" text-anchor="middle" font-size="12" fill="#1e3a8a">Ganglia near/in organ — عقد قريبة</text>
  <line x1="300" y1="105" x2="190" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="360" y1="105" x2="470" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#a2)"/>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect x="120" y="330" width="180" height="70" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="210" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Catabolic</text>
  <text x="210" y="380" text-anchor="middle" font-size="12" fill="#78350f">Fight or flight — هروب/قتال</text>
  <rect x="360" y="330" width="180" height="70" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="450" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Anabolic</text>
  <text x="450" y="380" text-anchor="middle" font-size="12" fill="#14532d">Rest and digest — راحة/هضم</text>
  <line x1="170" y1="270" x2="200" y2="326" stroke="#b91c1c" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="490" y1="270" x2="460" y2="326" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a2)"/>
  <text x="330" y="440" text-anchor="middle" font-size="13" fill="#334155">Postganglionic: NE (sympathetic) / ACh (parasympathetic) — الناقل بعد العقدة</text>
