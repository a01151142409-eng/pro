<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, sans-serif">
  <rect width="640" height="430" fill="#f8fafc"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Levels of Organization — مستويات التنظيم البنيوي</text>
  <rect x="40" y="55" width="560" height="42" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="320" y="83" text-anchor="middle" font-size="16" font-weight="700" fill="#075985">Molecules — الجزيئات</text>
  <rect x="40" y="110" width="560" height="42" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="320" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Organelles — العضيات</text>
  <rect x="40" y="165" width="560" height="42" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="320" y="193" text-anchor="middle" font-size="16" font-weight="700" fill="#3730a3">Cell — الخلية</text>
  <rect x="40" y="220" width="560" height="42" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="320" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">Tissue — النسيج</text>
  <rect x="40" y="275" width="560" height="42" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="320" y="303" text-anchor="middle" font-size="16" font-weight="700" fill="#831843">Organ — العضو</text>
  <rect x="40" y="330" width="560" height="42" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="320" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Organ system — جهاز الأعضاء</text>
  <text x="320" y="405" text-anchor="middle" font-size="14" fill="#334155">اضغط على النقاط لاستكشاف كل مستوى — Tap the pins to explore each level</text>
</svg>
