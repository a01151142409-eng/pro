<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, sans-serif">
  <rect width="640" height="430" fill="#f8fafc"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Body Fluid Compartments — قاعدة 60-40-20</text>
  <rect x="60" y="60" width="520" height="330" rx="14" fill="#cffafe" stroke="#0e7490" stroke-width="2.5"/>
  <text x="320" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#155e75">Total body fluids = 60% of body weight</text>
  <text x="320" y="112" text-anchor="middle" font-size="14" fill="#155e75">إجمالي سوائل الجسم = 60% من وزن الجسم</text>
  <rect x="90" y="130" width="310" height="230" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="245" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">ICF — داخل الخلية</text>
  <text x="245" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">40% of body weight</text>
  <text x="245" y="215" text-anchor="middle" font-size="13" fill="#713f12">K⁺ ≈ 140 mOsm/L</text>
  <text x="245" y="237" text-anchor="middle" font-size="13" fill="#713f12">Proteins + phosphates سالبة</text>
  <rect x="420" y="130" width="140" height="105" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="490" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Plasma</text>
  <text x="490" y="178" text-anchor="middle" font-size="13" fill="#14532d">البلازما ≈ 3L</text>
  <text x="490" y="198" text-anchor="middle" font-size="12" fill="#14532d">(20% of ECF... 1/4)</text>
  <rect x="420" y="250" width="140" height="110" rx="12" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/>
  <text x="490" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">Interstitial</text>
  <text x="490" y="298" text-anchor="middle" font-size="12" fill="#831843">الخلالي ≈ 11L</text>
  <text x="490" y="318" text-anchor="middle" font-size="12" fill="#831843">(3/4 of ECF)</text>
  <text x="320" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#155e75">ECF = 20% of body weight = Interstitial + Plasma</text>
  <text x="320" y="412" text-anchor="middle" font-size="13" fill="#155e75">السائل خارج الخلية = 20% من وزن الجسم = خلالي + بلازما</text>
</svg>